name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      # tree-sitter-language-pack downloads grammars from GitHub on first use;
      # cache them so a GitHub outage (HTTP 5xx) does not fail the whole suite.
      - name: Cache tree-sitter grammars
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-grammars-${{ hashFiles('uv.lock') }}

      - name: Download tree-sitter grammars
        run: |
          for attempt in 1 2 3 4 5; do
            if uv run python -c "import tree_sitter_language_pack as t; t.download(['python', 'typescript'])"; then
              exit 0
            fi
            echo "Grammar download failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run tests
        run: uv run pytest -v --cov=debtector --cov-report=term-missing

  quality:
    name: Lint & Security
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit security check
        run: uv run bandit -r src/ -c pyproject.toml
