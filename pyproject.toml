[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debtector"
version = "0.17.0"
description = "Coupling guardrail for CI/PR: detects cycles, god modules and coupling regressions before merge"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "aitormf"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter-language-pack>=1.0,!=1.6.3",
    "networkx>=3.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "bandit[toml]>=1.7",
    "commitizen>=3.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/aitormf/debtector"
Repository = "https://github.com/aitormf/debtector"
"Bug Tracker" = "https://github.com/aitormf/debtector/issues"

[project.scripts]
debtector = "debtector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
# Declared explicitly: ruff otherwise sorts an import of a module that does not exist yet
# (a red test of a new module) as third-party.
known-first-party = ["debtector"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Bandit — security analysis
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]
skips = []

# ---------------------------------------------------------------------------
# Commitizen — conventional commits
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"  # actualiza [project].version y uv.lock
version_files = ["src/debtector/__init__.py"]
tag_format = "v$version"
annotated_tag = true  # git push --follow-tags solo sube tags anotados

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=debtector --cov-report=term-missing"
norecursedirs = ["tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
# Red-commit test of change pr-diff/T1: its import order is frozen by the task-done protection.
"tests/test_diff.py" = ["I001"]
